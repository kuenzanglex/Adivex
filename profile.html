<!DOCTYPE html>
<html>

<head>

    <title>Student Profile - Adivex</title>

    <link rel="stylesheet" href="profile.css">

</head>

<body>

    <div class="profile-container">

        <h1>Adivex</h1>

        <h2>My Profile</h2>

        <div class="profile-picture">

            <img id="profilePicture"
                 src="default-profile.png"
                 alt="Profile Picture">

        </div>


        <div class="profile-info">

            <h3 id="profileName">Student Name</h3>

            <p id="profileEmail">student@email.com</p>

        </div>


        <div class="profile-section">

            <h3>About Me</h3>

            <p>
                Hello! I am a student at Adivex.
                I enjoy learning new skills and helping others.
            </p>

        </div>


        <div class="profile-section">

            <h3>My Skills</h3>

            <div class="skills">

                <span>Python</span>
                <span>HTML</span>
                <span>CSS</span>

            </div>

        </div>


        <div class="profile-buttons">

            <button onclick="goBack()">
                Back to Dashboard
            </button>

        </div>

    </div>


    <script src="profile.js"></script>

</body>

</html>
